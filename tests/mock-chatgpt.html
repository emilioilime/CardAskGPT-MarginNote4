<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CardAskGPT Browser Fixture</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f5f5f3;
        color: #1f1f1e;
      }
      header {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        border-bottom: 1px solid #ddd;
        background: #fff;
      }
      #temporary {
        border: 1px solid #c9c9c5;
        background: #fff;
        border-radius: 999px;
        padding: 10px 16px;
        font-weight: 600;
      }
      #temporary[aria-pressed="true"] {
        color: #fff;
        border-color: #20211f;
        background: #20211f;
      }
      main {
        width: min(860px, calc(100% - 48px));
        margin: 48px auto;
      }
      #state {
        padding: 14px 16px;
        border: 1px solid #d8d7d2;
        border-radius: 12px;
        background: #fff;
      }
      #answer-card {
        margin: 0 0 24px;
        padding: 20px;
        border: 1px solid #d8d7d2;
        border-radius: 18px;
        background: #fff;
      }
      #answer {
        line-height: 1.7;
      }
      #copy-answer {
        margin-top: 14px;
        padding: 8px 12px;
        border: 1px solid #c8c8c3;
        border-radius: 9px;
        background: #fff;
      }
      #clipboard-state {
        margin-top: 12px;
        color: #285b32;
      }
      #markdown-block {
        position: relative;
        margin-top: 18px;
        padding: 18px;
        border-radius: 14px;
        background: #f3f3f1;
      }
      #copy-markdown {
        position: absolute;
        top: 10px;
        right: 10px;
      }
      #markdown-block pre {
        margin: 18px 0 0;
        white-space: pre-wrap;
      }
      #previews {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px;
        margin: 0 0 18px;
      }
      .attachment {
        position: relative;
      }
      .attachment img {
        display: block;
        width: 100%;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 12%);
      }
      .attachment button {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 999px;
        color: #fff;
        background: rgb(0 0 0 / 72%);
      }
      .composer {
        min-height: 116px;
        padding: 18px;
        border: 1px solid #c8c8c3;
        border-radius: 26px;
        background: #fff;
      }
      #prompt-textarea {
        min-height: 48px;
        outline: none;
      }
      #send-button {
        float: right;
        min-width: 88px;
        margin-top: 10px;
        padding: 8px 14px;
        border: 0;
        border-radius: 999px;
        color: #fff;
        background: #20211f;
      }
      #send-button:disabled {
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>ChatGPT 模拟页面</strong>
      <button id="temporary" aria-label="Temporary chat" aria-pressed="false">
        Temporary
      </button>
    </header>
    <main>
      <article
        id="answer-card"
        data-message-author-role="assistant"
        aria-label="ChatGPT 测试回答"
      >
        <div id="answer" class="markdown">
          <h2>这是 ChatGPT 的测试回答</h2>
          <p>复制后应保留 <strong>粗体</strong>、<em>斜体</em>和代码格式。</p>
        </div>
        <button id="copy-answer" type="button" aria-label="Copy response">
          复制回答
        </button>
        <section id="markdown-block" data-testid="code-block-markdown">
          <strong>Markdown</strong>
          <button
            id="copy-markdown"
            type="button"
            aria-label="Copy code"
            data-testid="copy-code-button"
          >
            复制
          </button>
          <pre><code># 原子性（Atomicity）

**定义**：事务中的操作必须全部完成。</code></pre>
        </section>
        <div id="clipboard-state">等待复制测试……</div>
      </article>
      <div id="state">等待插件注入……</div>
      <form class="composer">
        <div id="previews"></div>
        <div id="prompt-textarea" contenteditable="true"></div>
        <input id="file-input" type="file" accept="image/*" multiple hidden />
        <button
          id="send-button"
          type="submit"
          data-testid="send-button"
          aria-label="Send prompt"
          disabled
        >
          发送
        </button>
      </form>
    </main>

    <script src="../src/chatgptBridge.js"></script>
    <script>
      const state = document.querySelector("#state")
      const temporary = document.querySelector("#temporary")
      const input = document.querySelector("#file-input")
      const previews = document.querySelector("#previews")
      const answer = document.querySelector("#answer")
      const markdownCode = document.querySelector("#markdown-block code")
      const answerMarkdown =
        "# 这是 ChatGPT 的测试回答\n\n复制后应保留 **粗体**、*斜体*和代码格式。"
      const clipboardState = document.querySelector("#clipboard-state")
      const prompt = document.querySelector("#prompt-textarea")
      const sendButton = document.querySelector("#send-button")
      window.fixtureSendCount = 0
      document.querySelector("form").addEventListener("submit", (event) => {
        event.preventDefault()
        if (sendButton.disabled) return
        window.fixtureSendCount += 1
        window.fixtureLastSentPrompt = prompt.innerText || prompt.textContent
        prompt.innerHTML = ""
        sendButton.disabled = true
      })
      prompt.addEventListener("input", () => {
        sendButton.disabled = !(prompt.innerText || prompt.textContent).trim()
      })

      temporary.addEventListener("click", () => {
        temporary.setAttribute("aria-pressed", "true")
        temporary.textContent = "Temporary enabled"
      })

      input.addEventListener("change", () => {
        Array.from(input.files).forEach((file) => {
          const attachment = document.createElement("div")
          attachment.className = "attachment"
          attachment.dataset.filename = file.name
          const image = document.createElement("img")
          image.alt = file.name
          image.src = URL.createObjectURL(file)
          const remove = document.createElement("button")
          remove.type = "button"
          remove.setAttribute("aria-label", `Remove file ${file.name}`)
          remove.textContent = "×"
          remove.addEventListener("click", () => attachment.remove())
          attachment.append(image, remove)
          previews.append(attachment)
        })
      })

      document.addEventListener("cardaskgpt-status", (event) => {
        const detail = event.detail || {}
        state.textContent = `${detail.code}: ${detail.detail}`
        state.dataset.code = detail.code || ""
      })

      document.addEventListener("cardaskgpt-clipboard", (event) => {
        const detail = event.detail || {}
        const payload = detail.payload || {}
        window.fixtureClipboardPayload = payload
        window.fixtureCopiedText = payload.plainText || ""
        const formats = [
          payload.plainText ? "text" : "",
          payload.html ? "html" : "",
          payload.rtf ? "rtf" : "",
          payload.markdown ? "markdown" : ""
        ].filter(Boolean)
        clipboardState.textContent =
          `已捕获原始格式：${formats.join(" + ")}；${window.fixtureCopiedText}`
        clipboardState.dataset.source = detail.source || ""
      })

      eval(CardAskGPTBridge.makeClipboardBridge())
      document.querySelector("#copy-answer").addEventListener("click", () => {
        navigator.clipboard.writeText(answerMarkdown)
      })
      document
        .querySelector("#copy-markdown")
        .addEventListener("click", () => {
          navigator.clipboard.writeText(markdownCode.textContent)
        })

      window.makeFixturePayload = (id, title, page = "42") => ({
        id,
        title,
        page,
        blocks: [
          { type: "text", kind: "title", text: title },
          {
            type: "text",
            kind: "excerpt",
            text:
              "定义：当前选中的 MarginNote 卡片应与 ChatGPT 输入框附件保持同步。"
          },
          {
            type: "text",
            kind: "comment",
            text:
              "单选时只保留一张图片；多选三张卡片时只保留三张图片。"
          }
        ]
      })

      window.injectFixture = (payloads, options) => {
        eval(CardAskGPTBridge.makeInjection(payloads, true, options))
      }

      window.injectFixture([
        window.makeFixturePayload("fixture-note", "隔离性（Isolation）")
      ])
    </script>
  </body>
</html>
